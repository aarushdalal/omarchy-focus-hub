<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161922"/>
      <stop offset="100%" stop-color="#0c0d12"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#3D7BFF"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)" stroke="#262b3a" stroke-width="2"/>
  <circle cx="64" cy="64" r="44" fill="url(#halo)"/>

  <!-- Precision Viewfinder Brackets -->
  <path d="M34 46V38a4 4 0 0 1 4-4h8" fill="none" stroke="#5a6582" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M82 34h8a4 4 0 0 1 4 4v8" fill="none" stroke="#5a6582" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M94 82v8a4 4 0 0 1-4 4h-8" fill="none" stroke="#5a6582" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M46 94h-8a4 4 0 0 1-4-4v-8" fill="none" stroke="#5a6582" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cardinal Axes Ticks -->
  <line x1="64" y1="26" x2="64" y2="32" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="96" x2="64" y2="102" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="64" x2="32" y2="64" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="96" y1="64" x2="102" y2="64" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Outer Focus Ring -->
  <circle cx="64" cy="64" r="28" fill="none" stroke="#363f54" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Primary Target Ring -->
  <circle cx="64" cy="64" r="18" fill="none" stroke="url(#accentGlow)" stroke-width="3"/>

  <!-- Center Core Aperture -->
  <circle cx="64" cy="64" r="7" fill="url(#accentGlow)"/>
